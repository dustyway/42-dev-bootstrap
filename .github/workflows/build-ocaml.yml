name: Build OCaml

# Builds an OCaml toolchain (compiler, ocamlfind, utop, ocaml-lsp-server, dune)
# with opam and publishes the switch as a GitHub Release asset. ocaml-bootstrap
# pulls from these releases after an sgoinfre wipe.
#
# Why this workflow exists: the cluster could build all of this itself, but it
# would take many minutes of small-file churn on NFS after every wipe, and it
# would need a persistent opam root there. Shipping the finished switch needs
# no opam on the cluster at all.
#
# Built at a neutral prefix, $OCAML_ROOT/<version>, and run from wherever
# ocaml-bootstrap unpacks it. OCaml 5.5's compiler finds its stdlib relative
# to its own binary, and ocamlfind its findlib.conf; utop and ocamllsp embed
# the build-time paths, so ocaml-bootstrap's ~/bin wrappers for them set
# OCAMLLIB and OCAMLFIND_CONF. The smoke test below unpacks the tarball at a
# different path, with the build tree deleted, to prove this.
#
# Runner pinned to ubuntu-22.04 for the glibc 2.35 floor that matches the 42
# cluster baseline — same reasoning as build-emacs.yml.
#
# Trigger by pushing a tag named ocaml-<VERSION>[-r<N>], e.g.:
#   git tag ocaml-5.5.2-r1 && git push origin ocaml-5.5.2-r1
# -r<N> marks a rebuild of the same OCaml version (changed packages or build
# settings); ocaml-bootstrap records it, so installs pick the rebuild up.
# Or run manually via the Actions UI (workflow_dispatch).

on:
  push:
    tags:
      - "ocaml-*"
  workflow_dispatch:
    inputs:
      release:
        description: "Release to build: OCaml version, optionally -r<N> (e.g. 5.5.2-r1)"
        required: true
        default: "5.5.2-r1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      OCAML_ROOT: /opt/ocaml
      OPAM_VERSION: "2.6.1"
      OPAM_SHA256: b533d393a6967150d6ef41cb3d71e147e93ecbabeb59e921aa412c0ae79ebe3d
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            rel="${{ inputs.release }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
            rel="${tag#ocaml-}"
          fi
          [[ "$rel" =~ ^[0-9]+(\.[0-9]+)+(-r[0-9]+)?$ ]] || { echo "bad release: $rel" >&2; exit 1; }
          # opam's compiler version, without the -r<N> rebuild suffix.
          echo "version=${rel%-r*}" >> "$GITHUB_OUTPUT"
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          echo "tag=ocaml-$rel" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          # Same Azure-mirror workaround as build-inotify-tools.yml.
          sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update
          sudo apt-get install -y --no-install-recommends \
            build-essential m4 unzip bzip2 rsync git

      - name: Install opam
        run: |
          curl -fsSL --retry 5 --retry-delay 10 --retry-max-time 300 -o opam \
            "https://github.com/ocaml/opam/releases/download/${OPAM_VERSION}/opam-${OPAM_VERSION}-x86_64-linux"
          echo "${OPAM_SHA256}  opam" | sha256sum -c -
          sudo install -m 0755 opam /usr/local/bin/opam
          rm opam
          sudo mkdir -p "$OCAML_ROOT"
          sudo chown "$(id -u):$(id -g)" "$OCAML_ROOT"

      - name: Build switch
        env:
          OPAMROOT: ${{ env.OCAML_ROOT }}
          OPAMYES: "1"
        run: |
          v="${{ steps.ver.outputs.version }}"
          # No sandbox: the runner is throwaway, so bwrap would protect nothing.
          opam init --bare --disable-sandboxing --no-setup
          opam switch create "$v" "ocaml-base-compiler.$v"
          opam install --switch="$v" ocamlfind utop ocaml-lsp-server dune

      - name: Package tarball
        run: |
          v="${{ steps.ver.outputs.version }}"
          out="ocaml-${{ steps.ver.outputs.release }}-linux-x86_64.tar.gz"
          # opam's bookkeeping and build trees are dead weight without opam.
          rm -rf "$OCAML_ROOT/$v/.opam-switch"
          tar -C "$OCAML_ROOT" -czf "$out" "$v"
          sha256sum "$out" > "${out}.sha256"
          ls -lh "$out" "${out}.sha256"

      - name: Smoke-test the tarball
        run: |
          rel="${{ steps.ver.outputs.release }}"
          # Unpack somewhere other than the build prefix, then delete the build
          # and hide opam: this tests what ocaml-bootstrap installs, at a path
          # the toolchain wasn't built for.
          prefix="$RUNNER_TEMP/relocated/$rel"
          mkdir -p "$prefix"
          tar -xzf "ocaml-${rel}-linux-x86_64.tar.gz" -C "$prefix" --strip-components=1
          sudo rm -rf "$OCAML_ROOT"
          sudo rm /usr/local/bin/opam
          mkdir -p check
          cd check
          cat > sleeper.ml <<'EOF'
          let () = Unix.sleep 0; print_endline "linked unix"
          EOF
          cat > script.ml <<'EOF'
          #use "topfind";;
          #require "unix";;
          print_endline "topfind works";;
          EOF
          # Clean environment: no opam env, same variables as the ~/bin
          # wrappers in ocaml-bootstrap.
          run() { env -i HOME="$HOME" TERM=dumb PATH="$prefix/bin:/usr/bin:/bin" "$@"; }
          wrapped() {
            run CAML_LD_LIBRARY_PATH="$prefix/lib/stublibs:$prefix/lib/ocaml/stublibs" \
                OCAML_TOPLEVEL_PATH="$prefix/lib/toplevel" \
                OCAMLLIB="$prefix/lib/ocaml" \
                OCAMLFIND_CONF="$prefix/lib/findlib.conf" "$@"
          }
          [[ "$(run ocamlopt -where)" == "$prefix/lib/ocaml" ]]
          run ocamlopt -version
          run ocamlfind ocamlopt -package unix -linkpkg sleeper.ml -o sleeper
          ./sleeper
          wrapped ocaml script.ml
          wrapped utop -version
          [[ "$(printf '#require "unix";;\nprint_endline "utop ok";;\n' | wrapped utop -stdin)" == *"utop ok"* ]]
          run ocamllsp --version
          run dune --version
          mkdir -p proj/bin
          printf '(lang dune 3.0)\n' > proj/dune-project
          printf '(executable (name main) (libraries unix))\n' > proj/bin/dune
          cp sleeper.ml proj/bin/main.ml
          (cd proj && run dune build && ./_build/default/bin/main.exe)
          if run grep -rIl /home/runner "$prefix/lib/findlib.conf" "$prefix/lib/ocaml/ld.conf"; then
            echo "runner path leaked into config" >&2
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: |
            ocaml-${{ steps.ver.outputs.release }}-linux-x86_64.tar.gz
            ocaml-${{ steps.ver.outputs.release }}-linux-x86_64.tar.gz.sha256
          generate_release_notes: true
