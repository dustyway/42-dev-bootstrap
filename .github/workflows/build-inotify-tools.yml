name: Build inotify-tools

# Builds inotify-tools from upstream git tags and publishes the result as a
# GitHub Release asset. inotify-tools-bootstrap pulls from these releases.
#
# Why this workflow exists: inotify-tools upstream doesn't publish pre-built
# `dist` tarballs (only raw git snapshots), so local builds need
# `autoreconf --install` which needs libtool — and libtool isn't available
# on 42 cluster machines (no root, not in the mise registry). GitHub's
# ubuntu-22.04 runner has libtool in apt, so we build here and ship the
# resulting static binaries.
#
# Static linking: ./configure --disable-shared --enable-static folds
# libinotifytools into the CLI binaries, so the tarball doesn't need to
# bundle a .so or a wrapper script. Binaries depend only on glibc.
#
# Runner pinned to ubuntu-22.04 for the glibc 2.35 floor that matches the
# 42 cluster baseline — same reasoning as build-emacs.yml.
#
# Version string: upstream's configure.ac isn't always bumped when a release
# is tagged (tag 4.25.9.0 still says 4.23.9.0), so the build sets AC_INIT to
# the version being built, and the smoke test checks `--help` reports it.
#
# Upstream 4.26 and later are a Rust rewrite without autotools; this
# workflow builds the 4.25 line.
#
# Trigger by pushing a tag named inotify-tools-<VERSION>[-r<N>], e.g.:
#   git tag inotify-tools-4.25.9.0-r1 && git push origin inotify-tools-4.25.9.0-r1
# -r<N> marks a rebuild of the same upstream version; inotify-tools-bootstrap
# records it, so installs pick the rebuild up.
# Or run manually via the Actions UI (workflow_dispatch).

on:
  push:
    tags:
      - "inotify-tools-*"
  workflow_dispatch:
    inputs:
      release:
        description: "Release to build: upstream version, optionally -r<N> (e.g. 4.25.9.0-r1)"
        required: true
        default: "4.25.9.0-r1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            rel="${{ inputs.release }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
            rel="${tag#inotify-tools-}"
          fi
          [[ "$rel" =~ ^[0-9]+(\.[0-9]+)+(-r[0-9]+)?$ ]] || { echo "bad release: $rel" >&2; exit 1; }
          # Upstream's tag, without the -r<N> rebuild suffix.
          echo "version=${rel%-r*}" >> "$GITHUB_OUTPUT"
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          echo "tag=inotify-tools-$rel" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          # The Azure apt mirror GitHub runners default to
          # (azure.archive.ubuntu.com) periodically goes dark; apt's default
          # retry schedule then stalls the build for 20+ minutes before
          # falling back to archive.ubuntu.com. Strip the Azure entry from
          # the mirror list and cap retries + timeout so apt fails fast.
          sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool m4

      - name: Fetch source
        run: |
          v="${{ steps.ver.outputs.version }}"
          curl -fsSL --retry 5 --retry-delay 10 --retry-max-time 300 \
            -o inotify-tools.tar.gz \
            "https://github.com/inotify-tools/inotify-tools/archive/refs/tags/${v}.tar.gz"
          tar -xf inotify-tools.tar.gz
          mv "inotify-tools-${v}" inotify-tools

      - name: Configure + build (static)
        working-directory: inotify-tools
        run: |
          v="${{ steps.ver.outputs.version }}"
          sed -i -E "s/^AC_INIT\(\[inotify-tools\], *\[[^]]*\]\)/AC_INIT([inotify-tools], [$v])/" configure.ac
          grep -F "AC_INIT([inotify-tools], [$v])" configure.ac
          ./autogen.sh
          # --disable-shared / --enable-static rolls libinotifytools into
          # the CLI binaries so the shipped tarball has self-contained
          # executables (no LD_LIBRARY_PATH hacks, no wrapper scripts).
          ./configure \
            --prefix=/opt/inotify-tools \
            --disable-shared \
            --enable-static \
            CFLAGS="-O2 -pipe"
          make -j"$(nproc)"
          make install DESTDIR="$GITHUB_WORKSPACE/staging"

      - name: Package tarball
        run: |
          v="${{ steps.ver.outputs.version }}"
          out="inotify-tools-${{ steps.ver.outputs.release }}-linux-x86_64.tar.gz"
          # Rename the install dir so the tarball's top level is
          # inotify-tools-<v>/ (consistent with emacs-/postgres-bootstrap).
          mv "staging/opt/inotify-tools" "staging/opt/inotify-tools-${v}"
          tar -C staging/opt -czf "$out" "inotify-tools-${v}"
          sha256sum "$out" > "${out}.sha256"
          ls -lh "$out" "${out}.sha256"

      - name: Smoke-test the tarball
        run: |
          v="${{ steps.ver.outputs.version }}"
          mkdir -p check
          tar -xzf "inotify-tools-${{ steps.ver.outputs.release }}-linux-x86_64.tar.gz" -C check --strip-components=1
          # Scrub LD_LIBRARY_PATH so we catch any missing dep the target
          # machine wouldn't have (same reasoning as build-emacs's smoke
          # test). Static link means nothing should be missing.
          unset LD_LIBRARY_PATH
          check/bin/inotifywait --help | head -3
          check/bin/inotifywatch --help | head -3
          # The binaries must report the version they were built as.
          for t in inotifywait inotifywatch; do
            [[ "$(check/bin/$t --help 2>&1 | head -1)" == "$t $v" ]] \
              || { echo "$t reports '$(check/bin/$t --help 2>&1 | head -1)', expected $v" >&2; exit 1; }
          done
          # Round-trip: start the watcher on a tmp dir, touch a file, assert
          # the MODIFY event lands within the timeout.
          watchdir=$(mktemp -d)
          touch "$watchdir/f"
          ( sleep 0.5 && echo x > "$watchdir/f" ) &
          out=$(check/bin/inotifywait -q -e modify --timeout 3 --format '%e' "$watchdir")
          echo "event: $out"
          [[ "$out" == *MODIFY* ]] || { echo "no MODIFY event detected" >&2; exit 1; }
          rm -rf "$watchdir"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: |
            inotify-tools-${{ steps.ver.outputs.release }}-linux-x86_64.tar.gz
            inotify-tools-${{ steps.ver.outputs.release }}-linux-x86_64.tar.gz.sha256
          generate_release_notes: true
